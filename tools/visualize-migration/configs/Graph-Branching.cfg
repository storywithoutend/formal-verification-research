\* Current-code facts for a few user-visible flows.
\* A1, A5, and C5 are expected to violate their invariants (see current-expectations.tsv).
\* C5 is the one scenario with real branching from a single ready state (five report actions).
SPECIFICATION Spec

CONSTANTS
  ModelMode = "current"
  DisabledGuard = "None"
  EnabledScenarios = {"A1", "A5", "A7", "C5"}

INVARIANT TypeOK
INVARIANT A1_OneExecutionPerScope
INVARIANT A5_PendingAttemptNeverReprompts
INVARIANT A7_RejectionDropsOnlyIntent
INVARIANT C5_OutcomeAndViewsAreTruthful

CHECK_DEADLOCK FALSE
